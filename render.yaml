services:
  - type: web
    name: trcmusic-web
    env: docker
    plan: free # Change this if you need a paid tier
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: TOKEN
        sync: false
      - key: MONGO_DB_URI
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: OWNER_ID
        sync: false
      - key: LOGGER_ID
        sync: false
      # Optional environment variables
      - key: START_IMG_URL
        value: "https://te.legra.ph/file/52792e7acc085c69eeb14.jpg"
      - key: PING_IMG_URL
        value: "https://te.legra.ph/file/52792e7acc085c69eeb14.jpg"
      - key: SUPPORT_CHANNEL
        value: "https://t.me/OP_SUPPORTS"
      - key: SUPPORT_CHAT
        value: "https://t.me/Princes_log_support_group"
      - key: ARC_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      - key: DURATION_LIMIT
        value: "86400"
      - key: QUEUE_LIMIT
        value: "10"
      - key: LEAVE_ON_DEMOTED
        value: "false"
      - key: MAX_AUTH_USERS
        value: "25"
